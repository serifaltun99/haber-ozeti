name: build
on:
  schedule:
    - cron: "0 */6 * * *"   # UTC; 03:00 09:00 15:00 21:00 TR saatiyle
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md"]   # doküman değişikliği boşuna API isteği atmasın
concurrency: build
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # çeviriler çalıştırmalar arasında saklansın: sadece yeni başlıklar API'ye gitsin
      - uses: actions/cache@v4
        with:
          path: cache
          key: ceviri-${{ github.run_id }}
          restore-keys: ceviri-
      - run: python build.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deploy
